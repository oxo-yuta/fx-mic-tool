<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>fx-mic editor — EP–2350</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body>

<div class="app">

  <!-- ─────────────────────────── ヘッダ ─────────────────────────── -->
  <header class="masthead">
    <div class="logo">
      <div class="logo__mark">FX</div>
      <div class="logo__name"><b>MIC</b><span>EDITOR</span></div>
    </div>

    <div class="masthead__meta">
      <div class="rowflex">
        <span class="chip is-orange">EP–2350</span>
        <span class="chip is-grey" id="diskChip"></span>
        <span class="chip is-grey" id="micChip"></span>
      </div>
      <div class="ver">V 0.2.0 · <span id="subtitle"></span></div>
    </div>

    <div class="modes" id="modes">
      <button class="mode is-on" data-mode="fx" id="modeFx"></button>
      <button class="mode" data-mode="sample" id="modeSample"></button>
    </div>

    <div class="masthead__right">
      <select id="langSelect" aria-label="language"></select>
      <button id="btnHelp">?</button>
    </div>
  </header>

  <!-- ─────────────────────── 左: デバイス ─────────────────────── -->
  <div class="stack">
    <section class="panel screws">
      <div class="screw-b"></div>
      <div class="panel__bar"><span id="panelDevice"></span><span class="spacer"></span><span id="deviceState"></span></div>
      <div class="panel__body">

        <div class="device-wrap" id="deviceWrap">
        <svg class="device" id="device" viewBox="6 8 254 314" role="img" aria-label="fx-mic">
          <!-- ハンドルは本体より先に描いて背面に置く。回転軸は本体側（46,46）。 -->
          <g id="handleGroup" class="hit">
            <path id="handle"
                  d="M52 24 L20 60 C7 118 16 170 34 198 L66 208 C49 150 41 84 46 24 Z"
                  fill="#e05526" stroke="#000005" stroke-width="2" stroke-linejoin="round"/>
            <circle cx="28" cy="98" r="4.5" fill="#000005"/>
          </g>

          <!-- 本体 -->
          <rect x="44" y="18" width="180" height="292" fill="#e7e7e5" stroke="#000005" stroke-width="2"/>
          <rect x="44" y="18" width="180" height="163" fill="#2f2f2f" stroke="#000005" stroke-width="2"/>
          <g id="grille" fill="#4a4a4a"></g>

          <!-- 右エッジのボタン -->
          <g id="btnFx" class="hit">
            <rect x="224" y="52" width="15" height="30" fill="#e05526" stroke="#000005" stroke-width="2"/>
          </g>
          <g id="btnSampleSel" class="hit">
            <rect x="224" y="112" width="15" height="28" fill="#e7e7e5" stroke="#000005" stroke-width="2"/>
          </g>
          <g id="btnTrig" class="hit">
            <rect x="224" y="196" width="15" height="28" fill="#9aa0a9" stroke="#000005" stroke-width="2"/>
          </g>

          <!-- LED（実機と同じく FX 4 個 / サンプル 4 個） -->
          <rect x="192" y="44" width="17" height="59" fill="#1b1b1b" stroke="#000005" stroke-width="1.5"/>
          <g id="ledFx"></g>
          <rect x="192" y="118" width="17" height="59" fill="#1b1b1b" stroke="#000005" stroke-width="1.5"/>
          <g id="ledSample"></g>

          <text x="66" y="222" font-family="Space Grotesk, sans-serif" font-size="26" font-weight="700" fill="#221f1f">MIC</text>
          <text x="118" y="215" font-family="Space Grotesk, sans-serif" font-size="14" font-weight="700" fill="#e05526">FX</text>
          <circle cx="76" cy="266" r="15" fill="#e05526" stroke="#000005" stroke-width="2"/>
          <path d="M66 258 L86 274 M66 266 L86 282 M70 254 L86 266" stroke="#000005" stroke-width="1.4" opacity=".55"/>

          <!-- マイク動作ランプ -->
          <g id="micLamp">
            <circle id="micLampGlow" cx="134" cy="288" r="13" fill="#ff2d1a" opacity="0"/>
            <circle id="powerLed" cx="134" cy="288" r="5.5" fill="#6b6b6b" stroke="#000005" stroke-width="1.2"/>
          </g>

          <g fill="none" stroke="#8a959a" stroke-width="1.6">
            <circle cx="58" cy="196" r="5"/><circle cx="210" cy="196" r="5"/>
            <circle cx="58" cy="296" r="5"/><circle cx="210" cy="296" r="5"/>
          </g>
        </svg>
        </div>

        <div class="handle-rail">
          <span class="chip is-light" id="handleLabel"></span>
          <input type="range" id="handleSlider" min="0" max="100" value="0">
          <span class="param__val" id="handleVal">0%</span>
        </div>

        <div class="rowflex" style="margin-top:10px">
          <button id="btnMic" class="is-primary"></button>
          <button id="btnShake"></button>
          <button id="btnPlay"></button>
        </div>

        <canvas class="scope" id="scope" width="600" height="112" style="margin-top:10px"></canvas>
        <p class="hint" id="deviceHint" style="margin:9px 0 0"></p>
      </div>
    </section>
  </div>

  <!-- ─────────────────────── 中央: エディタ ─────────────────────── -->
  <div class="stack" id="centerCol">

    <!-- FX モード -->
    <div class="stack" id="fxMode">
      <section class="panel screws">
        <div class="screw-b"></div>
        <div class="panel__bar"><span id="panelPresets"></span><span class="spacer"></span><span id="presetsHint"></span></div>
        <div class="slots" id="slots"></div>
      </section>

      <section class="panel screws">
        <div class="screw-b"></div>
        <div class="panel__bar">
          <span id="editorTitle"></span><span class="spacer"></span><span id="editorPos"></span>
        </div>
        <div class="panel__body stack" id="editorBody"></div>
      </section>
    </div>

    <!-- SAMPLE モード -->
    <div class="stack hidden" id="sampleMode">
      <section class="panel screws">
        <div class="screw-b"></div>
        <div class="panel__bar"><span id="panelSamples"></span><span class="spacer"></span><span id="sampleBudget"></span></div>
        <div class="panel__body stack">
          <p class="hint" id="samplesHint"></p>
          <div class="stack" id="sampleSlots"></div>
          <div class="diag" id="sampleWarn"></div>
        </div>
      </section>
    </div>
  </div>

  <!-- ─────────────────────── 右: テンプレート / ディスク ─────────── -->
  <div class="stack">

    <section class="panel screws">
      <div class="screw-b"></div>
      <div class="panel__bar"><span>templates</span></div>
      <div class="panel__body stack">
        <div class="tpl-list" id="templates"></div>
        <div class="tpl-divider"><span>teenage engineering</span></div>
        <div class="tpl-list" id="tePacks"></div>
        <input type="file" id="filePack" accept=".json,.zip,application/json,application/zip" class="hidden">
        <p class="hint" id="teHint"></p>
      </div>
    </section>

    <section class="panel screws">
      <div class="screw-b"></div>
      <div class="panel__bar"><span id="panelDisk"></span><span class="spacer"></span><span id="diskName"></span></div>
      <div class="panel__body stack">
        <div class="rowflex">
          <button id="btnConnect" class="is-primary"></button>
          <button id="btnReload" disabled class="is-small"></button>
        </div>
        <div class="budget"><div class="budget__fill" id="budgetFill"></div><div class="budget__label" id="budgetLabel"></div></div>
        <div class="diag" id="diskFiles"></div>
        <div class="rowflex">
          <button id="btnWrite" class="is-primary" disabled></button>
          <button id="btnDownload" class="is-small"></button>
        </div>
        <p class="hint" id="diskHint"></p>
      </div>
    </section>

    <!-- 通常は隠れていて、検証エラーが出たときだけ現れる -->
    <section class="panel screws hidden" id="errorPanel">
      <div class="screw-b"></div>
      <div class="panel__bar is-error"><span id="errorTitle"></span></div>
      <div class="panel__body"><div class="diag" id="diag"></div></div>
    </section>

    <section class="panel screws">
      <div class="screw-b"></div>
      <div class="panel__bar">
        <span id="panelJson"></span><span class="spacer"></span>
        <button id="btnCopy" class="bar-btn"></button>
        <button id="btnToggleJson" class="bar-btn"></button>
      </div>
      <div class="panel__body hidden" id="jsonBody">
        <pre id="jsonOut"></pre>
      </div>
    </section>
  </div>

</div>

<script type="module" src="./app.js"></script>
</body>
</html>
